<!DOCTYPE html>
{% load static %} 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier l'article</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="{% static 'css/mdb.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
    {% include 'navmomo.html'%}
    {% include '_toasts.html' %}

    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2 class="text-center my-3"> Modifier l'article : {{ object.titre }} </h2>
                
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label">{{ field.label }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}

                    <button type="submit" class="btn btn-warning btn-block my-3"> 
                        <i class="fas fa-edit"></i> METTRE À JOUR 
                    </button>
                    <a href="{% url 'my-article' %}" class="btn btn-light btn-block">Annuler</a>
                </form>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="{% static 'js/mdb.umd.min.js' %}"></script>
</body>
</html>
