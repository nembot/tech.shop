{% load static %}
<!-- Fragment navbar vendeur : inclus dans base.html (pas de <html>/<head>/<body> ici) -->
<nav class="navbar navbar-expand-lg bg-body-tertiary" aria-label="Navigation vendeur">
  <div class="container-fluid">
    <button
      data-mdb-collapse-init
      class="navbar-toggler"
      type="button"
      data-mdb-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Ouvrir la navigation"
    >
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="navbar-brand" href="{% url 'home' %}">Tech.Shop</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'mes_commandes' %}">Mes ventes</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'mes_achats' %}">Mes achats</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'my-article' %}">Mes articles</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'statistiques' %}">Statistiques</a>
        </li>
      </ul>
    </div>
    <div class="d-flex align-items-center">
      {% if user.is_authenticated %}
        <div class="me-3">
           <span class="text-dark">Bonjour, <strong>{{ user.username }}</strong></span>
        </div>
      {% endif %}

      <div class="dropdown">
        <a
          data-mdb-dropdown-init
          class="dropdown-toggle d-flex align-items-center hidden-arrow"
          href="#"
          id="navbarDropdownMenuAvatar"
          role="button"
          aria-expanded="false"
          aria-label="Menu du compte {{ user.username|default:'invité' }}"
        >
          <img
            src="https://mdbcdn.b-cdn.net/img/new/avatars/2.webp"
            class="rounded-circle"
            height="40"
            width="40"
            alt="Avatar de {{ user.username|default:'l’utilisateur' }}"
            loading="lazy"
          />
        </a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdownMenuAvatar">
          <li><a class="dropdown-item" href="{% url 'my-article' %}">Mes articles</a></li>
          <li><a class="dropdown-item" href="{% url 'mes_commandes' %}">Mes ventes</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="{% url 'deconnexion' %}">Déconnexion</a></li>
        </ul>
      </div>
    </div>
  </div>
</nav>
