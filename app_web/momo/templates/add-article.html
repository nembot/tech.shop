<!DOCTYPE html>
{% load static %} 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" />
    <link rel="stylesheet" href="{% static 'css/mdb.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>
<body>
    
    {% include 'navmomo.html'%}
    {% include '_toasts.html' %}

    {% block content %}
     <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2 class="text-center  my-3"> Saisie des articles </h2>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <!-- la fonction en haut c'est pour la securite en django -->
                    {{form}}
                    <button  type="submit" class="btn btn-info btn-block  my-3"> Enregistrer </button>
                </form>
            </div>
        </div>
     </div>

    {% endblock %}





    <script type="text/javascript" src="{% static 'js/mdb.umd.min.js' %}"></script>
</body>
</html>
