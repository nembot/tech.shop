<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connexion à votre compte Tech.Shop.">
    <title>Connexion — Tech.Shop</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/mdb.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/techshop.css' %}" />
</head>
<body class="ts-auth-body">
    <a class="visually-hidden-focusable" href="#connexion-form">Aller au formulaire</a>
    {% include '_toasts.html' %}
    <main class="ts-auth-card">
        <h1>Connexion</h1>
        <form method="post" action="{% url 'connexion' %}" id="connexion-form" novalidate>
            {% csrf_token %}
            <label for="id-username">Nom d'utilisateur</label>
            <input id="id-username" type="text" name="username" required autocomplete="username" maxlength="150">
            <label for="id-password">Mot de passe</label>
            <input id="id-password" type="password" name="password" required autocomplete="current-password">
            <button class="btn-auth" type="submit">Se connecter</button>
        </form>
        <p class="ts-auth-link">Pas encore inscrit ? <a href="{% url 'inscription' %}">S'inscrire</a></p>
        <p class="ts-auth-link"><a href="{% url 'home' %}">← Retour à la boutique</a></p>
    </main>
</body>
</html>
