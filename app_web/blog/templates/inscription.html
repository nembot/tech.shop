<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
</head>
<body>
{% include '_toasts.html' %}
<div class="container">
    <div class="form-container"> <form method="post" action="{% url 'inscription' %}">
             {% csrf_token %}
             <h1>Inscription</h1> 
             
             <div class="django-form">
                {{ form.as_p }}
             </div>

             <button type="submit"> S'inscrire</button>
        </form>
         <p class="link">Déjà inscrit ? <a href="{% url 'connexion' %}">Se connecter</a></p>
    </div>
</div>

    <style>
        /* CSS */
        /* Import Google font - Poppins */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        h1 {
            margin: 20px 0;
        }

        body {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            background: #fff;
            border-radius: 7px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

        .container .form {
            padding: 30px;
        }

        label {
            padding: 10px 0;
            color: #009579;
            cursor: pointer;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 17px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        a {
            font-size: 16px;
            color: #009579;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        button {
            color: #fff;
            background: #009579;
            width: 100%;
            padding: 10px;
            font-size: 17px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            outline: none;
        }

        button:hover {
            background: #006653;
        }

        .link {
            text-align: center;
            margin-top: 20px;
        }
        .error {
            background-color: red;
            color: #fff;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 14px;      
            text-align: center; 
        }
        ul {
            list-style: none;
            color: red;
        }
        /* Empêche les éléments de s'aligner bizarrement */
.django-form p {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-bottom: 15px;
    width: 100%;
}

/* Style pour les textes d'aide (les petits textes en gris/rouge) */
.helptext, .errorlist {
    font-size: 12px;
    color: #666;
    margin-top: 5px;
    display: block;
}

.errorlist {
    color: red;
    padding: 0;
}

/* Ajuste ton container pour qu'il s'agrandisse selon le contenu */
.container {
    width: 100%;
    max-width: 450px; /* Plus flexible */
    background: #fff;
    padding: 20px;
    border-radius: 7px;
    /* Enlève la hauteur fixe si tu en avais une */
}

    </style>
</body>
</html>
